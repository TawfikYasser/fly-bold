name: .DeFeC3
build_dependencies:
  - pip
  - setuptools
  - wheel
dependencies:
  - fedn
  - torch==2.4.1; (sys_platform == "darwin" and platform_machine == "arm64") or (sys_platform == "win32" or sys_platform == "win64" or sys_platform == "linux")
  # PyTorch macOS x86 builds deprecation
  - torch==2.2.2; sys_platform == "darwin" and platform_machine == "x86_64"
  - torchvision==0.19.1; (sys_platform == "darwin" and platform_machine == "arm64") or (sys_platform == "win32" or sys_platform == "win64" or sys_platform == "linux")
  - torchvision==0.17.2; sys_platform == "darwin" and platform_machine == "x86_64"
  - numpy<2; (sys_platform == "darwin" and platform_machine == "arm64") or (sys_platform == "win32" or sys_platform == "win64" or sys_platform == "linux")
  - numpy<2; (sys_platform == "darwin" and platform_machine == "x86_64")
  - yolov5==7.0.14
  - matplotlib>=3.2.2
  - opencv-python-headless==4.9.0.80
  - Pillow>=7.1.2
  - PyYAML>=5.3.1
  - requests>=2.23.0
  - huggingface-hub>=0.24.0,<0.25.0
  - scipy>=1.4.1
  - tqdm>=4.64.0
  - pandas>=1.1.4
  - seaborn>=0.11.0
  - psutil
  - thop>=0.1.1
  - protobuf>=5.0.0,<6.31.0
  - pycocotools>=2.0.6
  - pillow