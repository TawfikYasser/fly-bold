# Remove the python_env tag below to handle the environment manually
network_id: fedn-network
# python_env: python_env.yaml 

entry_points:
  build:
    command: /venv/bin/python model.py
  startup:
    command: /venv/bin/python data.py
  train:
    command: /venv/bin/python train.py
  validate:
    command: /venv/bin/python validate.py
  predict:
    command: /venv/bin/python predict.py