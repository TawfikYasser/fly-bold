# REFERENCE TEMPLATE: This file shows the structure of client Docker Compose files.
# The actual files are dynamically generated by deploy-application.sh with correct
# client IDs (0-9) and SERVER_INTERNAL_IP values.
version: '3.8'
services:
  fedn-client-0:
    image: ${DOCKER_IMAGE}
    working_dir: /app
    command: ["client","start","--combiner","${COMBINER_HOST}","--combiner-port","12080","-in","client/fedn.yaml","--name","client-${CLIENT_ID_1}","--local-package"]
    environment:
      FEDN_CLIENT_ID: ${CLIENT_ID_1}
    volumes:
      - ./fedn.yaml:/app/client/fedn.yaml
      - ../logs:/app/logs
  fedn-client-1:
    image: ${DOCKER_IMAGE}
    working_dir: /app
    command: ["client","start","--combiner","${COMBINER_HOST}","--combiner-port","12080","-in","client/fedn.yaml","--name","client-${CLIENT_ID_2}","--local-package"]
    environment:
      FEDN_CLIENT_ID: ${CLIENT_ID_2}
    volumes:
      - ./fedn.yaml:/app/client/fedn.yaml
      - ../logs:/app/logs
networks:
  default:
    driver: bridge
