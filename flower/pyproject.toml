# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-benchmarks"
version = "1.0.219"
description = "Federated Learning for YOLOv5 on GCP"
license = "Apache-2.0"
# Dependencies for your Flower App
# flwr[rest] is needed for SuperLink with REST backend
# flwr[simulation] is kept for local simulation testing
dependencies = [
    "flwr[rest,simulation]>=1.26.1",
    "flwr-datasets[vision]>=0.5.0",
    "protobuf>=5.28.2",
    "numpy>=1.24.4,<2.0.0",
    "optuna>=4.8.0",
    "flaml[automl]>=2.3.0",
    "torch==2.0.0+cpu",
    "torchvision==0.15.1+cpu",
    "pycocotools>=2.0.6",
    "opencv-python>=4.7.0",
    "matplotlib>=3.5.0",
    "pandas>=1.5.0",
    "albumentations>=1.3.0",
    "tqdm>=4.64.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
    "prometheus-client==0.19.0",
    "Pillow==10.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
# For pip to find CPU-only PyTorch versions
pytorch = [
    "torch==2.0.0+cpu ; platform_system != 'Darwin'",
    "torchvision==0.15.1+cpu ; platform_system != 'Darwin'"
]

# CRITICAL FIX: Include yolov5 models directory with YAML files
[tool.hatch.build]
include = [
    "src/flower_benchmarks",
    "yolov5",
    "yolov5/**/*.yaml",
    "yolov5/**/*.py",
    "download_coco_n_images.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flower_benchmarks", "yolov5"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flower_benchmarks",
    "yolov5",
    "yolov5/**/*.yaml",
    "pyproject.toml",
    "README.md"
]

[tool.flwr.app]
publisher = "tawfik"

[tool.hatch.metadata]
allow-direct-references = true

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "flower_benchmarks.server_app:app"
clientapp = "flower_benchmarks.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
gcs_bucket = "flybold-coco-inf022"
num-server-rounds = 10  
fraction-train = 1  
fraction_evaluate = 1  
local-epochs = 3  
lr = 0.000259  
use_pretrained = 1  
pretrained_checkpoint = ""  # Optional: Path to previous .pt checkpoint to resume training from
task = "detection"  # "classification" or "detection"
yolo_runs_dir = "./yolov5/runs/train"  # Runs dir for YOLO training
yolo_size = "s"  # n, s, m, l, or x
img_size = 416  
batch_size = 32  
dataset = 0  
strategy = 3  
run_id = 510530001  

# HPO Configuration
# ── NESTED HPO MODE ──────────────────────────────────────────────────────
# Server searches ONLY lr (hpo_trials/hpo_rounds below).
# Each client searches ONLY local_epochs/batch_size, every round, every
# trial -- conditioned on that trial's lr (client_hpo_enabled + trials).
# Both use the SAME backend: flip use_flaml once, both follow it
# (server_app.py forwards client_hpo_backend to clients automatically).
#
# Experiment A -- Optuna (TPE + HyperbandPruner):        use_flaml = false
# Experiment B -- FLAML  (BlendSearch):                  use_flaml = true
# Everything else below is identical between the two experiments.
use_flaml = false  # true = use FLAML, false = use Optuna
hpo_trials = 5  # server-side trials -- each suggests one lr candidate
hpo_rounds = 1  # federated rounds run per server trial (proxy budget)
hpo_mode = "hpo_only"  # "hpo_only" = HPO only, "hpo_then_train" = HPO then final training with the winning lr

# Client-side HPO Configuration (per-client local search for local_epochs/batch_size)
# NESTED HPO MODE: this must be true (together with hpo_trials > 0 above) so
# that every server trial's mAP is a joint function of (lr, epochs, batch),
# not just lr with epochs/batch held fixed. Backend (Optuna/FLAML) follows
# use_flaml automatically -- no separate switch needed here.
client_hpo_enabled = true  # true = each client runs its own inner search every round
client_hpo_trials = 5  # Number of local trials per client PER ROUND. Cost multiplier:
                        # hpo_trials(6) x hpo_rounds(3) x num_clients(10) x client_hpo_trials(3)
                        # = 540 real training calls just to find the best lr -- tune down
                        # (e.g. hpo_rounds=2, client_hpo_trials=2) if that's too slow/costly.

# Adaptive Batch/Epoch Tuning (ABS -- client-side, per round)
# MUST be false for nested-HPO mode: it's mutually exclusive with
# client_hpo_enabled (if both are true, ABS silently wins and client_hpo is
# skipped -- see client_app.py). Re-enable this only if you go back to
# ABS instead of client-side Optuna/FLAML search.
adaptive_batch_enabled = false  
adaptive_batch_min = 8  # beta_min
adaptive_batch_max = 64  # beta_max
adaptive_batch_max_increases = 4  # H_beta -- max batch-size bumps per round
adaptive_batch_rmd_threshold = 0.01  # rho threshold below which learning is "stalled"
adaptive_batch_rmd_patience = 2  # consecutive stalled epochs before bumping batch
adaptive_batch_growth_factor = 2.0  # multiplicative batch growth per bump
adaptive_batch_max_epochs = 10  # hard safety ceiling on epochs/round

# Adaptive Global LR Tuning (ALR -- server-side, final run only, not during HPO)
# Replaces the static `lr` above for the final training run: starts at
# adaptive_lr_min, grows toward adaptive_lr_max when validation loss improves,
# and falls back (shrinking the upper bound) when validation loss regresses.
# Set to false for the nested-HPO experiments below: the final run should use
# the server's HPO-winning lr as-is, not have ALR further adjust it on top.
adaptive_lr_enabled = false  
adaptive_lr_min = 0.0001  # lambda_min
adaptive_lr_max = 0.01  # lambda_max (initial upper bound)
adaptive_lr_max_reductions = 3  # H_lambda -- max LR rollbacks before terminating
adaptive_lr_growth_factor = 1.2  # multiplicative LR growth on improvement
adaptive_lr_backoff_factor = 0.5  # multiplicative LR shrink on regression

# FLAML-specific parameters (used when use_flaml = true)
flaml_time_budget = 36000  # Total time budget in seconds (1 hour default)
flaml_metric = "mAP50"  # Optimization metric: mAP50, mAP, loss, accuracy
flaml_estimator = "lgb"  # Estimator type: lgb (default)
flaml_sample_size = 32  # Number of samples per HPO iteration
flaml_use_coe = false  # Use cost-aware early exit
flaml_log_history = true  # Log trial history